# Render hosts this as a static site, which has no compute: the /api functions
# do not run here, so the analytics panel reports itself unavailable and the
# game plays normally. Analytics need the Vercel deploy.
services:
  - type: web
    name: tic-tac-toe
    runtime: static
    # No build step — the repo root is the site.
    staticPublishPath: .
    pullRequestPreviewsEnabled: false
    headers:
      # Same policy as the <meta> tag in index.html, plus frame-ancestors,
      # which browsers ignore unless it arrives as a real header.
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: "accelerometer=(), camera=(), geolocation=(), gyroscope=(), microphone=(), payment=(), usb=()"
      - path: /*
        name: Strict-Transport-Security
        value: "max-age=31536000; includeSubDomains"
